"$schema" = "https://starship.rs/config-schema.json"

# Не добавлять пустую строку перед приглашением
add_newline = false

# Максимальное время проверки модулей
command_timeout = 1000

# Используем собственную палитру
palette = "catppuccin_custom"

# Основной порядок элементов
format = """
[](fg:path_bg)\
$directory\
[](fg:path_bg)\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

# Справа показываем код ошибки и время
right_format = "$status$time"


# ----------------------------------------------------------
# Текущий каталог
# ----------------------------------------------------------

[directory]
style = "bold fg:path_fg bg:path_bg"

# Пробелы внутри нужны, чтобы фон не прилегал к тексту
format = "[   $path ]($style)[$read_only]($read_only_style)"

home_symbol = " ~"
read_only = " 󰌾 "
read_only_style = "bold fg:red bg:path_bg"

# Сколько последних каталогов показывать полностью
truncation_length = 5

# Не обрезать путь автоматически до корня Git-репозитория
truncate_to_repo = false

# Обозначение сокращённой части
truncation_symbol = "…/"

# Старые родительские каталоги сокращаются до одной буквы:
# ~/Projects/embedded/firmware/src
# превратится примерно в ~/P/e/firmware/src
fish_style_pwd_dir_length = 1


# ----------------------------------------------------------
# Git
# ----------------------------------------------------------

[git_branch]
symbol = " "
style = "bold fg:lavender"
format = " [$symbol$branch]($style)"

[git_status]
style = "bold fg:yellow"
format = " [$all_status$ahead_behind]($style)"

conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"


# ----------------------------------------------------------
# Время выполнения команды
# ----------------------------------------------------------

[cmd_duration]
min_time = 1000
show_milliseconds = false
style = "fg:overlay1"
format = " [󱎫 $duration]($style)"


# ----------------------------------------------------------
# Код завершения предыдущей команды
# ----------------------------------------------------------

[status]
disabled = false
symbol = "✘ "
success_symbol = ""
not_executable_symbol = "󰂭 "
not_found_symbol = "󰍉 "
sigint_symbol = "󰚌 "
signal_symbol = "󱐋 "
map_symbol = true

style = "bold fg:red"
format = "[$symbol$status]($style) "


# ----------------------------------------------------------
# Часы справа
# ----------------------------------------------------------

[time]
disabled = false
time_format = "%H:%M"
style = "fg:overlay0"
format = "[$time]($style)"


# ----------------------------------------------------------
# Символ ввода
# ----------------------------------------------------------

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:blue)"
vimcmd_replace_one_symbol = "[❮](bold fg:peach)"
vimcmd_replace_symbol = "[❮](bold fg:peach)"
vimcmd_visual_symbol = "[❮](bold fg:mauve)"


# ----------------------------------------------------------
# C / C++ / CMake
# ----------------------------------------------------------

[c]
symbol = " "
style = "fg:blue"
format = " [$symbol($version)]($style)"

[cpp]
symbol = " "
style = "fg:blue"
format = " [$symbol($version)]($style)"

[cmake]
symbol = " "
style = "fg:blue"
format = " [$symbol($version)]($style)"


# ----------------------------------------------------------
# Docker
# ----------------------------------------------------------

[docker_context]
symbol = " "
style = "fg:blue"
format = " [$symbol$context]($style)"
only_with_files = true


# ----------------------------------------------------------
# Палитра Catppuccin Mocha
# ----------------------------------------------------------

[palettes.catppuccin_custom]
path_bg = "#89b4fa"
path_fg = "#1e1e2e"

rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
